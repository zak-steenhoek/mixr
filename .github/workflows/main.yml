name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        mode: [release, dev]
        go: ["1.14"]

    steps:
      - name: Setup Go
        uses: actions/setup-go@v2
        with:
          go-version: ${{ matrix.go }}

      - name: Install prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libappindicator3-dev libwebkit2gtk-4.0-dev

      - name: Checkout
        uses: actions/checkout@v2

      - name: Test mixr (Windows, 386 and amd64)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($arch in '386', 'amd64') {
            $env:GOARCH = $arch
            go test -count=1 ./...
          }
          Remove-Item Env:GOARCH

      - name: Test mixr (Linux)
        if: runner.os == 'Linux'
        run: go test -count=1 ./...

      - name: Build mixr (Windows)
        if: runner.os == 'Windows'
        run: pkg/mixr/scripts/windows/build-${{ matrix.mode }}.bat
        shell: cmd

      - name: Build mixr (Linux)
        if: runner.os == 'Linux'
        run: pkg/mixr/scripts/linux/build-${{ matrix.mode }}.sh
